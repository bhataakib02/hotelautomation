<style>
:root{--bg:#f6f3ec;--sf:#fff;--tx:#14213d;--mu:#6b7080;--ac:#b8913f;--ac2:#14213d;--bd:#e5dfd0;--ok:#2f9e6e;--oc:#3b6fd4;--cl:#d9a21b;--mt:#e07b2a;--oos:#c93c3c;--rs:#7a55c4}

:root[data-th=nature]{--bg:#f2ecdf;--sf:#fbf8f0;--tx:#2f2a20;--mu:#7a705c;--ac:#5b7a3a;--ac2:#3c5a2a;--bd:#ddd3bc}
:root[data-th=scarlet]{--bg:#f5efe6;--sf:#fffaf2;--tx:#2a1414;--mu:#7a6560;--ac:#b8901f;--ac2:#7b1420;--bd:#e6d8c2}

:root[data-dark=true]:not([data-th=midnight]){--bg:#101319;--sf:#181c25;--tx:#eceff5;--mu:#9aa2b3;--bd:#2a3040}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.5 'Instrument Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
h1{font-size:30px}h2{font-size:22px}button,input,select{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{display:flex;height:100%}
nav{width:212px;background:var(--ac2);color:#f3ecd9;padding:18px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:none}
:root[data-th=midnight] nav{background:#141216;border-right:1px solid var(--bd)}

.top{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.top h1{flex:1}

select,input{background:var(--sf);border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.kpi small{color:var(--mu)}.kpi b{display:block;font:600 28px 'Cormorant Garamond',serif}.up{color:var(--ok);font-size:12px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.room{border:0;border-radius:12px;padding:10px 6px;color:#fff;text-align:center;transition:transform .15s}
.room:hover{transform:translateY(-3px)}.room b{display:block;font-size:17px}.room small{opacity:.9;font-size:11px}
.available{background:var(--ok)}.occupied{background:var(--oc)}.cleaning{background:var(--cl)}.maintenance{background:var(--mt)}.oos{background:var(--oos)}.reserved{background:var(--rs)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 12px;color:var(--mu);font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px}td,th{padding:9px 8px;border-bottom:1px solid var(--bd)}
.tbl{overflow-x:auto}.pill{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--bd)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.cols h3{margin-bottom:8px}
.task{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:8px}.task p{margin:0 0 6px}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px}.bars div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:26px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.md{background:var(--sf);border-radius:16px;padding:22px;width:min(460px,100%);max-height:90%;overflow:auto}.md label{display:block;margin:10px 0 3px;color:var(--mu);font-size:12px}.md input,.md select{width:100%}
.err{color:var(--oos);font-size:12px}
#toasts{position:fixed;right:16px;top:16px;z-index:40;display:grid;gap:8px}.toast{background:var(--ac2);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px #0004}
#bot{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0));z-index:15}
#bot .fab{background:var(--ac);color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px #0004}
#chat{display:none;position:absolute;right:0;bottom:52px;width:min(340px,88vw);height:420px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;flex-direction:column;overflow:hidden}
#chat.on{display:flex}#msgs{flex:1;overflow:auto;padding:12px;display:grid;gap:8px;align-content:start}
.m{padding:8px 11px;border-radius:12px;background:var(--bg);max-width:88%;white-space:pre-line}.m.u{background:var(--ac);color:#fff;justify-self:end}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 6px}.sug button{font-size:12px;border:1px solid var(--bd);background:none;border-radius:99px;padding:3px 9px}
#np{position:absolute;right:26px;top:60px;width:300px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;z-index:12;display:none}#np.on{display:block}
.note{padding:7px 0;border-bottom:1px solid var(--bd)}.note.un{font-weight:600}
.tabs{display:none}
@media(max-width:760px){nav{position:fixed;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;z-index:14;padding:6px}nav .logo{display:none}nav button{white-space:nowrap;padding:8px}main{padding:16px 14px 90px}#np{right:10px}}
body,nav,.card,.btn,.md,select,input,.task{transition:background-color .4s ease,color .4s ease,border-color .4s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main.vin>*{animation:vin .32s ease both}main.vin>*:nth-child(2){animation-delay:.05s}main.vin>*:nth-child(3){animation-delay:.1s}
:root[data-th=hogwarts]{--bg:#f2f0ec;--sf:#fff;--tx:#1c1a24;--mu:#6d6a76;--ac:#8a6a2c;--ac2:#211c38;--bd:#dedad2}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><style>.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px 22px;margin-top:18px}.fg label{display:block;color:var(--mu);font-size:12px;margin:0 0 6px}.fg input{width:100%;padding:11px 12px}.fg .w{grid-column:1/-1}
.stp{display:flex;gap:10px;margin-bottom:26px}.stp span{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);color:var(--mu);font-size:13px}.stp span.on{border-color:var(--ac);color:var(--tx);font-weight:600;background:color-mix(in srgb,var(--ac) 14%,transparent)}
.sm p{display:flex;justify-content:space-between;gap:16px;margin:0;padding:9px 0;border-bottom:1px solid var(--bd)}.sm span{color:var(--mu)}
.qrw svg{width:100%;height:auto;display:block}
:root[data-th=castle]{--bg:#0a0d1c;--sf:#151a35;--tx:#efe6cf;--mu:#a6a28c;--ac:#d4af37;--ac2:#080b18;--bd:#2c3360}
#app{position:relative;z-index:1}.card,.room{position:relative}
.card::before,.room::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--ac) 24%,transparent),transparent 70%)}
.card:hover::before,.room:hover::after{opacity:1}
#fx{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
[data-th=castle] #fx{display:block}
[data-th=castle] body{background:linear-gradient(#070a1a,#141a3a 65%,#1f2148) fixed}
[data-th=castle] nav{background:rgba(8,11,24,.82);backdrop-filter:blur(6px)}
[data-th=castle] .card{background:rgba(21,26,53,.72);backdrop-filter:blur(6px)}
[data-th=castle] h1,[data-th=castle] h2{color:#e8cf7a}
[data-th=castle] .btn{color:#1a1430}[data-th=castle] .btn.g{color:var(--tx)}
.stars{position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 12% 18%,#fffc,transparent),radial-gradient(1px 1px at 33% 9%,#fffd,transparent),radial-gradient(1.5px 1.5px at 58% 22%,#fffc,transparent),radial-gradient(1px 1px at 77% 12%,#fffe,transparent),radial-gradient(1.5px 1.5px at 90% 30%,#fffc,transparent),radial-gradient(1px 1px at 45% 40%,#fff9,transparent),radial-gradient(1px 1px at 22% 48%,#fffa,transparent);animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.moon{position:absolute;right:9%;top:8%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dfb8 60%,#b9ae82);box-shadow:0 0 60px 12px #f0e6b833;transform:translateX(calc(var(--px,0px)*.4))}
#fx svg.cs{position:absolute;bottom:0;left:-2%;width:104%;height:36vh;color:#04060d;transform:translateX(var(--px,0px));transition:transform .3s ease-out}
.wn{fill:#f5d67a;animation:fl 3.5s ease-in-out infinite alternate}@keyframes fl{from{opacity:.3}to{opacity:1}}
.cd{position:absolute;bottom:38vh;width:6px;height:22px;background:#efe5c8;border-radius:2px;animation:fy 7s ease-in-out infinite alternate}
.cd::before{content:"";position:absolute;left:-2px;top:-11px;width:10px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff6c0,#f5b032 60%,transparent 72%);box-shadow:0 0 14px 5px #f5b03266}
@keyframes fy{from{transform:translateY(0)}to{transform:translateY(-26px)}}
.bat{position:absolute;top:18%;left:-40px;width:26px;height:12px;fill:#03040a;animation:bt 20s linear infinite}@keyframes bt{to{transform:translateX(calc(100vw + 80px)) translateY(-40px)}}
.sp{position:fixed;z-index:70;width:7px;height:7px;pointer-events:none;background:radial-gradient(#fff,#f5d67a 50%,transparent 70%);border-radius:50%;animation:sp .8s ease-out forwards}@keyframes sp{to{transform:translate(var(--dx),26px) scale(.2);opacity:0}}</style></head><body>
<div id="fx" aria-hidden="true"></div><div id="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<div id="toasts" aria-live="polite"></div><div id="np" role="dialog" aria-label="Notifications"></div>
<div id="bot"><div id="chat"><div style="padding:10px 12px;border-bottom:1px solid var(--bd)"><h3>StayBot</h3></div><div id="msgs"></div><div class="sug" id="sug"></div><div style="display:flex;gap:6px;padding:10px"><input id="bi" aria-label="Ask StayBot" placeholder="Ask about your hotel" style="flex:1"><button class="btn" data-a="ask">Send</button></div></div><button class="fab" data-a="bot">StayBot</button></div>
<script>
const $=s=>document.querySelector(s),S={view:'dash',role:'Hotel Manager',notes:[],audit:[],hk:[],mt:[],orders:[],bk:[],inv:[],unread:0};
const ST={available:'Available',occupied:'Occupied',cleaning:'Cleaning',maintenance:'Maintenance',oos:'Out of service',reserved:'Reserved'};
const TY=n=>n<=110?['Standard',3200]:n<=120?['Deluxe',4500]:n<=126?['Executive',6200]:n<=129?['Suite',9800]:['Presidential',24000];
const G=['Aarav Mishra','Priya Nayak','Rohan Das','Ananya Patra','Vikram Sahoo','Meera Iyer','Kabir Singh','Sneha Rao','Arjun Mohanty','Ishita Jena','Nikhil Verma','Tanvi Joshi'];
S.rooms=[];for(let n=101;n<=130;n++){const[t,p]=TY(n),i=n-101;let st='available',g='',bal=0;
if(i%3==0&&i<24){st='occupied';g=G[i/3%12];bal=[0,1800,5400,12600][i%4]}else if(i==4||i==13)st='cleaning';else if(i==8)st='maintenance';else if(i==19)st='oos';else if(i==22||i==26)st='reserved';
S.rooms.push({n,t,p,st,g,bal,out:'11:00 AM'})}
S.hk=[{id:1,r:104,s:'To clean',p:'High',who:'Sunita'},{id:2,r:114,s:'In progress',p:'Normal',who:'Ramesh'}];
S.mt=[{id:1,r:109,i:'AC not cooling',c:'AC',p:'High',s:'Assigned',cost:0}];
S.inv=[['Bath towels','Linen',34,40,200],['Mineral water 1L','Beverages',180,120,600],['Shampoo sachets','Toiletries',260,150,900],['Basmati rice (kg)','Food',45,30,120],['Floor cleaner (L)','Cleaning',12,15,60]].map(a=>({n:a[0],c:a[1],q:a[2],min:a[3],max:a[4],use:a[2]>100?18:6}));
S.orders=[{id:204,r:106,items:['2 × Pasta','1 × Coke','1 × Garlic bread'],s:'New',amt:980},{id:205,r:112,items:['1 × Paneer tikka','2 × Naan'],s:'Preparing',amt:640}];
S.bk=[['BK-1041','Aarav Mishra',101,'Confirmed','2 nights',6400],['BK-1042','Priya Nayak',124,'Checked-in','3 nights',29400],['BK-1043','Rohan Das',123,'Pending','1 night',6200],['BK-1044','Meera Iyer',126,'Cancelled','2 nights',12400]].map(a=>({id:a[0],g:a[1],r:a[2],s:a[3],d:a[4],amt:a[5]}));
S.gl=[['Aarav Mishra','Regular',12400,3],['Priya Nayak','VIP',48200,9],['Rohan Das','Corporate',31800,6],['Ananya Patra','Premium',26500,5],['Meera Iyer','Regular',6200,1],['Kabir Singh','VIP',72400,14]].map(a=>({n:a[0],t:a[1],sp:a[2],v:a[3]}));
S.fbk=[{g:'Priya Nayak',r:5,c:'Lovely suite and friendly staff.'},{g:'Rohan Das',r:3,c:'Wi-Fi was slow in the room.'},{g:'Ananya Patra',r:4,c:'Great food, slow wifi at night.'}];
S.staff=[['Sunita','Housekeeping','Morning'],['Ramesh','Housekeeping','Evening'],['Geeta','Housekeeping','Morning'],['Bijay','Maintenance','Morning'],['Lopamudra','Front desk','Morning'],['Chef Sahu','Kitchen','Evening']].map(a=>({n:a[0],d:a[1],sh:a[2],pr:a[0]=='Ramesh'?false:true}));
const tier=sp=>sp>=60000?'Platinum':sp>=30000?'Gold':sp>=15000?'Silver':'Bronze';
const inr=n=>'₹'+n.toLocaleString('en-IN'),cnt=s=>S.rooms.filter(r=>r.st==s).length;
const now=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),3000)}
function log(a,e,p,n){S.audit.unshift({u:S.role,a,e,p:p||'-',n:n||'-',t:now()})}
function notify(t,d){S.notes.unshift({t,d,t2:now(),un:1});S.unread++;bell()}
function bell(){const b=$('#bell');if(b)b.textContent='Alerts'+(S.unread?' ('+S.unread+')':'')}
function room(n){return S.rooms.find(r=>r.n==n)}
function setRoom(n,st,why){const r=room(n),o=r.st;r.st=st;log('Room status changed','Room '+n,ST[o],ST[st]);return r}
const NAV={'Super Admin':'dash rooms cal an bk guests loy fb staff shift ev own chk guide hk mt rest kds inv bill ai auto audit set','Hotel Manager':'dash rooms cal an bk guests loy fb staff shift ev own chk guide hk mt rest kds inv bill ai auto audit set',Receptionist:'dash rooms cal bk guests chk guide bill',Housekeeping:'hk rooms',Maintenance:'mt',Restaurant:'rest kds inv',Guest:'guest chk guide'};
const LBL={dash:'Dashboard',rooms:'Room map',bk:'Reservations',hk:'Housekeeping',mt:'Maintenance',kds:'Kitchen',inv:'Inventory',bill:'Billing',ai:'AI insights',auto:'Automations',audit:'Audit log',set:'Settings',guest:'Guest portal',cal:'Calendar',guests:'Guests',loy:'Loyalty',fb:'Feedback',staff:'Staff',rest:'Restaurant',an:'Analytics',ev:'Events & packages',own:'Owner dashboard',shift:'Shifts',chk:'Digital check-in',guide:'Hotel guide'};
function nav(){const l=NAV[S.role].split(' ');if(!l.includes(S.view))S.view=l[0];$('#nav').innerHTML='<div class="logo">Stay<b>Flow</b></div>'+l.map(k=>`<button data-a="go" data-v="${k}" class="${k==S.view?'on':''}">${LBL[k]}</button>`).join('');render()}
function head(t,extra=''){return `<div class="top"><h1>${t}</h1>${extra}<input id="gs" aria-label="Search" placeholder="Search (Ctrl+K)" data-a="pal" readonly style="width:150px"><button class="btn g" id="bell" data-a="notes">Alerts</button><select id="role" aria-label="Role">${Object.keys(NAV).map(r=>`<option ${r==S.role?'selected':''}>${r}</option>`).join('')}</select></div>`}
const V={
dash(){const oc=cnt('occupied'),occ=Math.round(oc/30*100),rev=184500+S.rooms.reduce((a,r)=>a+r.bal,0),adr=Math.round(S.rooms.filter(r=>r.st=='occupied').reduce((a,r)=>a+r.p,0)/(oc||1)),pend=S.rooms.reduce((a,r)=>a+r.bal,0),d=[52,61,48,72,80,66,rev/3000|0],days=['Mon','Tue','Wed','Thu','Fri','Sat','Today'];
const k=[['Today\'s revenue',inr(rev),'↑ 12.8%'],['Occupancy',occ+'%','↑ 4.1%'],['Available rooms',cnt('available'),''],['Occupied rooms',oc,''],['Check-ins today',3,'↑ 1'],['Check-outs today',S.rooms.filter(r=>r.st=='occupied').length>0?4:0,''],['ADR',inr(adr),'↑ 2.3%'],['RevPAR',inr(Math.round(adr*occ/100)),'↑ 5.6%'],['Pending payments',inr(pend),'']];
return head('Aurelia Grand Hotel','')+`<p style="color:var(--mu);margin-top:-12px">Bhubaneswar · ${new Date().toDateString()}</p><div class="grid">${k.map(a=>`<div class="card kpi"><small>${a[0]}</small><b>${a[1]}</b><span class="up">${a[2]}</span></div>`).join('')}</div><div class="card" style="margin-bottom:18px"><h2>Revenue, last 7 days (₹ thousands)</h2><div class="bars" style="margin:14px 0 26px">${d.map((v,i)=>`<div style="height:${Math.min(v,100)}%" title="${v}k"><span>${days[i]}</span></div>`).join('')}</div></div><div class="card"><h2>Live rooms</h2>${map()}</div>`},
rooms(){return head('Room map')+`<div class="card">${map()}</div>`},
bk(){return head('Reservations','<button class="btn" data-a="newbk">New booking</button>')+`<div class="card tbl"><table><tr><th>ID<th>Guest<th>Room<th>Status<th>Stay<th>Amount<th></tr>${S.bk.map(b=>`<tr><td>${b.id}<td>${b.g}<td>${b.r}<td><span class="pill">${b.s}</span><td>${b.d}<td>${inr(b.amt)}<td>${b.s=='Confirmed'||b.s=='Pending'?`<button class="btn g" data-a="ci" data-id="${b.id}">Check in</button> `:''}${b.s=='Checked-in'?`<button class="btn g" data-a="co" data-id="${b.id}">Check out</button> `:''}${['Confirmed','Pending'].includes(b.s)?`<button class="btn g" data-a="cx" data-id="${b.id}">Cancel</button>`:''}</tr>`).join('')}</table></div>`},
hk(){const col=(s)=>S.hk.filter(t=>t.s==s).map(t=>`<div class="task"><p><b>Room ${t.r}</b> <span class="pill">${t.p}</span></p><p style="color:var(--mu)">${t.who}</p>${s=='To clean'?`<button class="btn g" data-a="hks" data-id="${t.id}">Start</button>`:s=='In progress'?`<button class="btn" data-a="hkd" data-id="${t.id}">Mark clean</button>`:''}</div>`).join('')||'<div class="empty">Queue is clear.</div>';
